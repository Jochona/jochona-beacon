[package]
name = "jochona-beacon"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Jochona Beacon: a hardened Linux LAN daemon that pairs with the Jochona Client and wakes registered Jochona/Sunshine/Apollo Hosts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jochona/jochona-beacon"
readme = "README.md"
publish = false

[[bin]]
name = "jochona-beacon"
path = "src/main.rs"

[lib]
name = "jochona_beacon"
path = "src/lib.rs"

[profile.release]
opt-level = 2
panic = "unwind"
strip = "symbols"

[dependencies]
# async runtime / http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync", "signal", "io-util", "process"] }
axum = { version = "0.7", features = ["json", "query", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "timeout"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"

# tls / certs
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
x509-parser = "0.16"

# storage
rusqlite = { version = "0.31", features = ["bundled"] }

# crypto
p256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
num-bigint = "0.4"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# ids / encoding / time
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
roxmltree = "0.20"
pem = "3"

# cli / logging
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# network discovery / interfaces
mdns-sd = "0.11"
if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }

# admin / qr
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# misc
thiserror = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
